<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">留言板</h1>
        
        <!-- 樣式設定區塊 -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">版面設定</h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">背景顏色</label>
                        <input type="color" class="form-control form-control-color" id="bgColor" value="#ffffff">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">字體顏色</label>
                        <input type="color" class="form-control form-control-color" id="textColor" value="#000000">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">字體選擇</label>
                        <select class="form-select" id="fontFamily">
                            <option value="'Microsoft JhengHei', sans-serif">微軟正黑體</option>
                            <option value="'PMingLiU', serif">新細明體</option>
                            <option value="'DFKai-SB', serif">標楷體</option>
                            <option value="Arial, sans-serif">Arial</option>
                            <option value="'Times New Roman', serif">Times New Roman</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 留言表單 -->
        <div class="card mb-4">
            <div class="card-body">
                <form id="messageForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">名稱</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">留言內容</label>
                        <textarea class="form-control" id="message" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">發佈留言</button>
                </form>
            </div>
        </div>

        <!-- 留言列表 -->
        <div id="messageList">
            <!-- 留言將被動態插入這裡 -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
